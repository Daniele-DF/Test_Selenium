  ```yaml
  name: Selenium Tests

  on:
    push:
      branches:
        - master
    pull_request:
      branches:
        - master

  jobs:
    test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Build and run tests in Docker
          env:
            EMAIL_LOGIN: ${{ secrets.EMAIL_LOGIN }}
            PASSWORD_LOGIN: ${{ secrets.PASSWORD_LOGIN }}
          run: docker compose up --build --exit-code-from tests tests

        - name: Stop containers
          if: always()
          run: docker compose down --volumes --remove-or